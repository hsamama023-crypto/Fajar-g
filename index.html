<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fajar ❤️</title>
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/833/833472.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}
.hero{min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px;text-align:center;background:radial-gradient(100% 70% at 50% 0%, #ff1a75 0%, #000 70%)}
.logo{width:130px;height:130px;border-radius:36px;background:linear-gradient(135deg,#ff1a75,#ffb3d1);display:flex;align-items:center;justify-content:center;font-size:72px;box-shadow:0 20px 60px rgba(255,26,117,.7);animation:float 3s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:42px;font-weight:900;margin-top:14px;line-height:1.1}h1 span{color:#ff8fab}
.sub{margin:18px 0;color:#ddd;font-size:18px;line-height:1.6;max-width:340px}
.btns{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;margin-top:24px}
.btn{width:100%;padding:18px;border-radius:50px;border:none;font-size:19px;font-weight:900;cursor:pointer}
.yes{background:#fff;color:#ff1a75;box-shadow:0 10px 30px rgba(255,255,255,.25)}
.no{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="hero">
<div class="logo">💖</div>
<h1>Will You Be My <span>Forever?</span></h1>
<p class="sub">My Dearest <b>Fajar</b>, you are my happiness, my peace, my everything.<br><b style="color:#fff">I Love You So Much!</b></p>
<div class="btns">
<button class="btn yes" id="yes">YES, I WILL! 😍💖</button>
<button class="btn no" id="no">No 🙈</button>
</div>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register(URL.createObjectURL(new Blob([`self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response('offline'))))`],{type:'text/javascript'})))}
const no=document.getElementById('no');no.addEventListener('touchstart',()=>{no.style.position='absolute';no.style.left=Math.random()*60+'%';no.style.top=Math.random()*60+'%'});no.addEventListener('mouseover',()=>{no.style.position='absolute';no.style.left=Math.random()*60+'%';no.style.top=Math.random()*60+'%'});
document.getElementById('yes').addEventListener('click',()=>{document.body.innerHTML='<div style=background:#000;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px><div style=font-size:90px>💖</div><h1 style=font-size:44px>She Said YES! 😭❤️</h1><p style=margin-top:20px;font-size:22px;color:#ffb3d1>You made me the happiest person in the world!<br><br><b style=color:#fff>I Love You Fajar, My Forever!</b></p></div>'});
</script>
</body>
</html>
