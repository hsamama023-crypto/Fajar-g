<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Proposal for Fajar G - by Samama</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Great+Vibes&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%, #7a1230 0%, #2a0510 25%, #000 70%);padding:16px;overflow:hidden}
#starsCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#fireworksCanvas{position:fixed;inset:0;z-index:50;pointer-events:none;display:none}
#nameStarsCanvas{position:fixed;inset:0;z-index:60;pointer-events:none;display:none}
.card{width:100%;max-width:390px;background:linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));backdrop-filter:blur(22px);border:1.5px solid rgba(255,42,90,0.35);border-radius:36px;padding:32px 24px 20px;text-align:center;position:relative;z-index:2}
.top-logo{position:absolute;top:14px;right:14px;width:38px;height:38px;background:rgba(0,0,0,0.6);border:1.5px solid rgba(255,42,90,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ff2a5a;font-weight:800;font-size:15px;cursor:pointer}
.logo{font-size:64px;animation:beat 1.2s infinite}
@keyframes beat{50%{transform:scale(1.18)}}
h1{font-size:26px;color:#fff;font-weight:800;margin:14px 0 8px;line-height:1.1}
h1 span{background:linear-gradient(90deg,#ff2a5a,#ffb3c1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#d8b4bc;font-size:13.5px;margin-bottom:22px}.sub b{color:#fff}
.btns{height:150px;position:relative;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,0.25);border-radius:22px;}
.btn{border:0;padding:14px 34px;border-radius:100px;font-weight:800;font-size:16px;cursor:pointer;position:absolute}
.yes{background:linear-gradient(135deg,#ff0055,#ff2a5a);color:#fff;left:50%;top:50%;transform:translate(-50%,-50%);animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.05)}}
.no{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);position:fixed;left:60%;top:65%;z-index:10}
.final-video{width:100%;max-height:36vh;object-fit:contain;border-radius:22px;border:2px solid #ff0055;margin:12px auto;display:block;background:#000}
.final{font-size:20px;font-weight:800;color:#fff;margin-top:12px}.final span{color:#ff2a5a}
.final2{font-family:'Great Vibes',cursive;font-size:34px;color:#ff8a9a;margin-top:6px}
.counter{margin-top:8px;font-size:10px;color:#ff8a9a;background:rgba(255,0,51,0.1);padding:6px 12px;border-radius:100px;display:inline-block;border:1px solid rgba(255,0,51,0.2)}
.caption{font-size:11px;color:#ffccd5;margin-top:4px;font-style:italic}
.action-btns{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.small-btn{padding:8px 14px;border-radius:100px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-size:11px;font-weight:600;cursor:pointer}
.small-btn.love{background:linear-gradient(135deg,#ff0033,#a50022);border:0}
.small-btn.album{background:linear-gradient(135deg,#ffaa00,#ff5500);border:0}
.dev{margin-top:16px;font-size:8px;letter-spacing:3px;color:rgba(255,255,255,0.35)}.dev b{color:#ff2a5a}
#aboutModal,#letterModal,#albumModal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
#aboutModal.show,#letterModal.show,#albumModal.show{display:flex}
.modal-box{width:100%;max-width:340px;background:#111;border:1.5px solid #ff0055;border-radius:24px;padding:22px;position:relative;max-height:85vh;overflow-y:auto}
.close{position:absolute;top:12px;right:14px;font-size:20px;color:#888;cursor:pointer}
.top-badge{position:absolute;top:14px;left:16px;background:rgba(255,0,51,0.12);border:1px solid rgba(255,0,51,0.3);padding:4px 9px;border-radius:100px;font-size:7px;letter-spacing:1.5px;color:#ff8a9a;font-weight:700}
.progress{height:4px;background:rgba(255,255,255,0.1);border-radius:10px;margin-bottom:15px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#ff2a5a,#ff8a9a);width:33%;transition:0.5s}
.stars-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:61;font-size:58px;font-weight:800;color:#fff;text-shadow:0 0 20px #ff2a5a, 0 0 40px #ff2a5a;display:none;letter-spacing:6px}
.stars-text.show{display:block}
.album-title{font-family:'Great Vibes',cursive;font-size:28px;color:#ff8a9a;text-align:center}
.album-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.album-item{border-radius:16px;overflow:hidden;border:1.5px solid #ff0055;background:#000}
.album-item video{width:100%;height:160px;object-fit:cover;display:block}
</style>
</head>
<body>
<canvas id="starsCanvas"></canvas>
<canvas id="fireworksCanvas"></canvas>
<canvas id="nameStarsCanvas"></canvas>
<div id="starsNameText" class="stars-text">FAJAR G ✨</div>

<div class="card" id="card">
<div class="top-badge" id="topBadge">QUESTION 1 OF 3</div>
<div class="top-logo" onclick="openAbout()">S</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="logo" id="mainLogo">🥺❤️</div>
<h1 id="mainTitle">Do You Love Me <span>a little? 🥺</span></h1>
<p class="sub" id="mainSub">Sach sach batana meri <b>Fajar G</b>!</p>
<div class="btns" id="area">
<button class="btn yes" id="yes">YES! 😍</button>
</div>
<div class="dev">DEVELOPED BY <b>SAMAMA</b></div>
</div>
<button class="btn no" id="no">No 🙈</button>

<div id="aboutModal" onclick="closeAbout()"><div class="modal-box" onclick="event.stopPropagation()"><div class="close" onclick="closeAbout()">✕</div><h3 style="color:#ff2a5a">ABOUT ME</h3><p style="color:#fff;font-size:13.5px;line-height:1.8;margin-top:12px">This is my first app for my most favourite person, Fajar G.<br><br><b style="color:#ff8a9a">Made with 🖤 by Samama</b></p></div></div>

<div id="letterModal" onclick="closeLetter()"><div class="modal-box" onclick="event.stopPropagation()"><div class="close" onclick="closeLetter()">✕</div><div style="font-size:48px;text-align:center">💌</div><h3 style="color:#ff2a5a;text-align:center">MY LOVE LETTER</h3><p id="typewriterText" style="color:#fff;font-size:13.5px;line-height:1.9;margin-top:12px;min-height:200px"></p></div></div>

<div id="albumModal" onclick="closeAlbum()"><div class="modal-box" onclick="event.stopPropagation()" style="max-width:380px"><div class="close" onclick="closeAlbum()">✕</div><div class="album-title">First Birthday 🎂<br>with First Proposal 💍</div><div class="album-grid"><div class="album-item"><video src="video1.mp4" controls playsinline></video></div><div class="album-item"><video src="video2.mp4" controls playsinline></video></div></div></div></div>

<script>
const starsCanvas=document.getElementById('starsCanvas');const sCtx=starsCanvas.getContext('2d');
function resizeStars(){starsCanvas.width=innerWidth;starsCanvas.height=innerHeight}resizeStars();addEventListener('resize',resizeStars);
let stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.2,blink:Math.random()*10});
(function drawStars(){sCtx.clearRect(0,0,starsCanvas.width,starsCanvas.height);stars.forEach(s=>{s.blink+=0.02;sCtx.globalAlpha=0.25+Math.abs(Math.sin(s.blink))*0.6;sCtx.fillStyle='#ff8a9a';sCtx.beginPath();sCtx.arc(s.x,s.y,s.r,0,Math.PI*2);sCtx.fill();});requestAnimationFrame(drawStars);})();

const fwCanvas=document.getElementById('fireworksCanvas');const fwCtx=fwCanvas.getContext('2d');
function resizeFW(){fwCanvas.width=innerWidth;fwCanvas.height=innerHeight}resizeFW();
let particles=[];function createFirework(x,y){for(let i=0;i<26;i++)particles.push({x,y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,life:1,color:`hsl(${340+Math.random()*20},100%,60%)`});}
function animateFW(){fwCtx.fillStyle='rgba(0,0,0,0.22)';fwCtx.fillRect(0,0,fwCanvas.width,fwCanvas.height);particles.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life-=0.02;fwCtx.globalAlpha=p.life;fwCtx.fillStyle=p.color;fwCtx.beginPath();fwCtx.arc(p.x,p.y,2.5,0,Math.PI*2);fwCtx.fill();if(p.life<=0)particles.splice(i,1);});if(fwCanvas.style.display!=='none')requestAnimationFrame(animateFW);}
function startFireworks(){fwCanvas.style.display='block';fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height);animateFW();let c=0;let int=setInterval(()=>{createFirework(Math.random()*innerWidth,Math.random()*innerHeight*0.5);c++;if(c>6)clearInterval(int);},180);setTimeout(()=>{fwCanvas.style.display='none';particles=[];},2000);}

const nameCanvas=document.getElementById('nameStarsCanvas');const nameCtx=nameCanvas.getContext('2d');
function resizeName(){nameCanvas.width=innerWidth;nameCanvas.height=innerHeight}resizeName();
function showNameInStars(){
  nameCanvas.style.display='block';
  document.getElementById('starsNameText').classList.add('show');
  let starParts=[];for(let i=0;i<150;i++) starParts.push({x:Math.random()*nameCanvas.width, y:Math.random()*nameCanvas.height, r:Math.random()*2+1, a:Math.random()});
  function drawNameStars(){nameCtx.clearRect(0,0,nameCanvas.width,nameCanvas.height);starParts.forEach(s=>{s.a+=0.05;nameCtx.globalAlpha=0.5+Math.sin(s.a)*0.5;nameCtx.fillStyle='#ff8a9a';nameCtx.beginPath();nameCtx.arc(s.x,s.y,s.r,0,Math.PI*2);nameCtx.fill();});if(nameCanvas.style.display!=='none') requestAnimationFrame(drawNameStars);}
  drawNameStars();
  setTimeout(()=>{nameCanvas.style.display='none';document.getElementById('starsNameText').classList.remove('show');},3500);
}

function openAbout(){document.getElementById('aboutModal').classList.add('show')}function closeAbout(){document.getElementById('aboutModal').classList.remove('show')}
const letterFullText = `Meri Pyaari Fajar G,<br><br>Ap meri duniya hain, meri subah shaam hain. Jab se Ap meri zindagi me aayi hain, har din khubsurat lagta hai.<br><br>Ap meri Queen hain, meri Pari hain, mera sab kuch hain.<br><br>Kya Ap hamesha ke liye meri banengi?<br><br><b style="color:#ff8a9a">Hamesha Ap Ka,<br>Samama 🖤❤️</b>`;
let typeInterval;
function openLetter(){
  document.getElementById('letterModal').classList.add('show');
  const el=document.getElementById('typewriterText'); el.innerHTML=''; let i=0; let tag=''; let inTag=false; clearInterval(typeInterval);
  typeInterval=setInterval(()=>{if(i>=letterFullText.length){clearInterval(typeInterval); return;} let char=letterFullText[i]; if(char==='<'){inTag=true; tag='';} if(inTag){tag+=char; if(char==='>'){inTag=false; el.innerHTML+=tag;}} else {el.innerHTML+=char;} i++;},22);
}
function closeLetter(){document.getElementById('letterModal').classList.remove('show');clearInterval(typeInterval);}
function openAlbum(){document.getElementById('albumModal').classList.add('show')}
function closeAlbum(){document.getElementById('albumModal').classList.remove('show'); document.querySelectorAll('#albumModal video').forEach(v=>v.pause());}

const noBtn=document.getElementById('no');
function moveNoButton(){const padding=20;const maxX=window.innerWidth-noBtn.offsetWidth-padding;const maxY=window.innerHeight-noBtn.offsetHeight-padding;const x=Math.random()*maxX;const y=Math.random()*maxY;noBtn.style.left=x+"px";noBtn.style.top=y+"px";}
moveNoButton();
noBtn.addEventListener('mouseenter', moveNoButton);
noBtn.addEventListener('touchstart', (e)=>{e.preventDefault(); moveNoButton();});
noBtn.addEventListener('click', (e)=>{e.preventDefault(); moveNoButton();});

const questions=[
  {logo:"🥺❤️", title:"Do You Love Me <span>a little? 🥺</span>", sub:`Sach sach batana meri <b>Fajar G</b>!`, badge:"QUESTION 1 OF 3", bar:"33%"},
  {logo:"😜💖", title:"Will You Annoy Me <span>Forever? 😜</span>", sub:`Socho, lifetime ka contract hai <b>Fajar G</b>!`, badge:"QUESTION 2 OF 3", bar:"66%"},
  {logo:"🖤❤️", title:"Will You Be Mine <span>Forever?</span>", sub:`My Queen <b>Fajar G</b>, you are my everything!`, badge:"FINAL QUESTION 💍", bar:"100%"}
];
let currentQ=0;
const yesBtn=document.getElementById('yes');
const mainTitle=document.getElementById('mainTitle');
const mainSub=document.getElementById('mainSub');
const mainLogo=document.getElementById('mainLogo');
const topBadge=document.getElementById('topBadge');
const progressBar=document.getElementById('progressBar');
function showQuestion(idx){
  mainLogo.innerText=questions[idx].logo;
  mainTitle.innerHTML=questions[idx].title;
  mainSub.innerHTML=questions[idx].sub;
  topBadge.innerText=questions[idx].badge;
  progressBar.style.width=questions[idx].bar;
}

yesBtn.onclick=()=>{
  if(currentQ < 2){
    currentQ++;
    showQuestion(currentQ);
    moveNoButton();
  } else {
    startFireworks();
    setTimeout(showNameInStars, 600);
    noBtn.style.display='none';
    document.getElementById('card').innerHTML=`
        <div class="top-badge">YES! SHE SAID YES!</div>
        <div class="top-logo" onclick="openAbout()">S</div>
        <div class="logo">😍🖤</div>
        <video id="myVideo" class="final-video" src="video.mp4" autoplay loop playsinline controls></video>
        <div class="caption">Our beautiful moment ❤️</div>
        <div class="final">Yayy! I Knew You'd Say <span>YES</span>, My Fajar G! 🥹❤️</div>
        <div class="final2">My Pari G I love you forever</div>
        <div class="counter" id="dayCounter"></div>
        <div class="action-btns">
          <button class="small-btn love" onclick="openLetter()">💌 Letter</button>
          <button class="small-btn album" onclick="openAlbum()">🎂 Album</button>
        </div>
        <div class="dev">DEVELOPED BY <b>SAMAMA</b></div>
    `;
    let startDate=new Date('2025-12-23');
    function updateCounter(){let diff=new Date()-startDate;let days=Math.floor(diff/(1000*60*60*24));let el=document.getElementById('dayCounter');if(el)el.innerText=`Together ${days} days & forever 💖`;}
    setInterval(updateCounter,1000);updateCounter();
    setTimeout(()=>{const v=document.getElementById('myVideo');if(v){v.muted=false;v.volume=1;v.play().catch(()=>{})}},200);
  }
};
</script>
</body>
</html>
