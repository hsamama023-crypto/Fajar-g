<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Proposal for Fajar G - by Samama</title>
<meta name="description" content="Made with love by Samama for Fajar G. This is my first ever project, a special proposal from my heart to my Queen Fajar G. You are my everything!">
<meta name="author" content="Samama">

<meta property="og:title" content="For My Fajar G 🖤❤️">
<meta property="og:description" content="Made by Samama for Fajar G - My first project, a heartfelt proposal. Will you be mine forever?">
<meta property="og:type" content="website">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%, #5a1020 0%, #1a0005 40%, #000 80%);padding:15px;overflow:hidden}
.card{width:100%;max-width:390px;background:rgba(255,255,255,0.06);backdrop-filter:blur(15px);border:1.5px solid rgba(255,0,51,0.35);border-radius:34px;padding:30px 22px;text-align:center;box-shadow:0 0 50px rgba(255,0,51,0.3)}
.logo{font-size:62px;animation:beat 1s infinite} @keyframes beat{50%{transform:scale(1.18)}}
h1{font-size:27px;margin:14px 0 6px;color:#fff;font-weight:800} h1 span{color:#ff2a5a;text-shadow:0 0 20px #ff2a5a}
.sub{color:#c9a0a8;font-size:13.5px;margin-bottom:26px}
.btns{height:135px;position:relative;display:flex;justify-content:center;align-items:center;gap:16px}
.btn{border:0;padding:15px 34px;border-radius:100px;font-weight:800;font-size:16px;cursor:pointer;transition:.25s}
.yes{background:linear-gradient(135deg,#ff0033,#a50022);color:#fff;box-shadow:0 8px 25px rgba(255,0,51,0.5);z-index:5}
.no{background:#151515;border:1px solid #333;color:#888;position:absolute;left:200px;top:50px;z-index:10}
.heart{position:fixed;top:-5%;animation:fall linear forwards;pointer-events:none;z-index:99} @keyframes fall{to{top:110vh;transform:rotate(360deg)}}
.final-video{width:100%;max-width:320px;height:500px;object-fit:cover;border-radius:28px;border:2.5px solid #ff0033;box-shadow:0 0 40px rgba(255,0,51,0.7);margin:16px auto;display:block;background:#000}
.final{font-size:23px;font-weight:800;color:#fff;line-height:1.3;margin-top:14px} .final span{color:#ff2a5a}
.final2{font-family:'Great Vibes',cursive;font-size:38px;color:#ff8a9a;margin-top:8px}
.lyric{margin-top:16px;font-size:14px;color:#ffd0d8;line-height:1.7;background:rgba(255,0,51,0.12);padding:14px;border-radius:18px;border:1px solid rgba(255,0,51,0.2)}
.dev{margin-top:22px;font-size:11px;letter-spacing:2px;color:rgba(255,255,255,0.35);text-transform:uppercase}
.dev b{color:rgba(255,42,90,0.7)}
</style>
</head>
<body>
<div class="card" id="card">
<div class="logo">🖤❤️</div>
<h1>Will You Be Mine <span>Forever?</span></h1>
<p class="sub">My Queen <b>Fajar G</b>, you are my everything!</p>
<div class="btns" id="area">
<button class="btn yes" id="yes">YES! 🥰</button>
<button class="btn no" id="no">No 🙈</button>
</div>
<div class="dev">Develop by <b>Samama</b> 🖤</div>
</div>
<script>
const noBtn=document.getElementById('no'); 
const area=document.getElementById('area');
let texts=["No 🙈","Are you sure? 😜","Pakka? 🤭","Socho phir se! 😏","Hehe 😂","Catch me! 🏃‍♀️","Nope! 😝","Meri jaan na"];
function runAway(){
  const maxX=area.clientWidth-90; 
  const maxY=area.clientHeight-55; 
  const x=Math.random()*maxX; 
  const y=Math.random()*maxY; 
  noBtn.style.left=x+'px'; 
  noBtn.style.top=y+'px'; 
  noBtn.innerText=texts[Math.floor(Math.random()*texts.length)];
}
noBtn.addEventListener('mouseenter',runAway); 
noBtn.addEventListener('touchstart',(e)=>{e.preventDefault();runAway();}); 
noBtn.addEventListener('click',(e)=>{e.preventDefault();runAway();return false;});
setInterval(()=>{
  let h=document.createElement('div');
  h.className='heart';
  h.innerText=['🖤','❤️','💋','✨','🌹'][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(18+Math.random()*22)+'px';
  h.style.animationDuration=(2+Math.random()*2.5)+'s';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),4500);
},140);
document.getElementById('yes').onclick=()=>{
 document.getElementById('card').innerHTML=`
  <div class="logo">😍🖤</div>
  <video class="final-video" src="lv_7520816118290828597_20260420053555.mp4" autoplay loop playsinline controls></video>
  <div class="final">Yayy! I Knew You'd Say <span>YES</span>,<br>My Fajar G! 🥹❤️</div>
  <div class="final2">My Pari G I love you forever</div>
  <div class="lyric">🎶 Aj tu le ma Teri hui,<br>Tu aj mera ve 🎶</div>
  <div class="dev">Develop by <b>Samama</b> 🖤</div>
 `;
};
</script>
</body>
</html>
