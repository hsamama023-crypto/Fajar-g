<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Proposal for Fajar G - by Samama</title>
<meta name="description" content="Made with love by Samama for Fajar G. This is my first ever project, a special proposal.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Great+Vibes&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%, #5a1020 0%, #1a0005 40%, #000 80%);padding:12px}
.card{width:100%;max-width:380px;background:rgba(255,255,255,0.07);backdrop-filter:blur(15px);border:1.5px solid rgba(255,0,51,0.35);border-radius:32px;padding:28px 20px;text-align:center;box-shadow:0 0 50px rgba(255,0,51,0.3)}
.logo{font-size:60px;animation:beat 1s infinite} @keyframes beat{50%{transform:scale(1.15)}}
h1{font-size:26px;color:#fff;font-weight:800;margin:10px 0} h1 span{color:#ff2a5a}
.sub{color:#c9a0a8;font-size:13px;margin-bottom:22px}
.btns{height:130px;position:relative;display:flex;justify-content:center;align-items:center;gap:14px}
.btn{border:0;padding:14px 32px;border-radius:100px;font-weight:800;font-size:16px;cursor:pointer}
.yes{background:linear-gradient(135deg,#ff0033,#a50022);color:#fff;box-shadow:0 8px 25px rgba(255,0,51,0.5);z-index:5}
.no{background:#151515;border:1px solid #333;color:#888;position:absolute;left:190px;top:45px}
.heart{position:fixed;top:-5%;animation:fall linear forwards;pointer-events:none} @keyframes fall{to{top:110vh}}
/* FIXED VIDEO STYLE */
.final-video{width:100%;height:auto;max-height:62vh;object-fit:contain;border-radius:22px;border:2px solid #ff0033;box-shadow:0 0 30px rgba(255,0,51,0.6);margin:12px auto;display:block;background:#000}
.final{font-size:20px;font-weight:800;color:#fff;margin-top:12px} .final span{color:#ff2a5a}
.final2{font-family:'Great Vibes',cursive;font-size:34px;color:#ff8a9a;margin-top:6px}
.lyric{margin-top:12px;font-size:13px;color:#ffd0d8;line-height:1.6;background:rgba(255,0,51,0.12);padding:12px;border-radius:16px}
.dev{margin-top:18px;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.35)} .dev b{color:#ff2a5a}
</style>
</head>
<body>
<div class="card" id="card">
<div class="logo">🖤❤️</div>
<h1>Will You Be Mine <span>Forever?</span></h1>
<p class="sub">My Queen <b>Fajar G</b>, you are my everything!</p>
<div class="btns" id="area">
<button class="btn yes" id="yes">YES! 🥰</button>
<button class="btn no" id="no">No 🙈</button>
</div>
<div class="dev">DEVELOP BY <b>SAMAMA</b> 🖤</div>
</div>
<script>
const noBtn=document.getElementById('no'); const area=document.getElementById('area');
let texts=["No 🙈","Are you sure? 😜","Pakka? 🤭","Socho! 😏","Hehe 😂","Catch me! 🏃‍♀️"];
function runAway(){
  const maxX=area.clientWidth-90; const maxY=area.clientHeight-55;
  noBtn.style.left=Math.random()*maxX+'px'; noBtn.style.top=Math.random()*maxY+'px';
  noBtn.innerText=texts[Math.floor(Math.random()*texts.length)];
}
noBtn.addEventListener('mouseenter',runAway);
noBtn.addEventListener('touchstart',(e)=>{e.preventDefault();runAway();});
noBtn.addEventListener('click',(e)=>{e.preventDefault();runAway();});

setInterval(()=>{
  let h=document.createElement('div'); h.className='heart';
  h.innerText=['🖤','❤️','💋','✨'][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+'vw'; h.style.fontSize=(18+Math.random()*18)+'px';
  h.style.animationDuration=(2+Math.random()*2)+'s';
  document.body.appendChild(h); setTimeout(()=>h.remove(),4000);
},150);

document.getElementById('yes').onclick=()=>{
 document.getElementById('card').innerHTML=`
  <div class="logo">😍🖤</div>
  <video id="myVideo" class="final-video" src="lv_7520816118290828597_20260420053555.mp4" autoplay loop playsinline controls></video>
  <div class="final">Yayy! I Knew You'd Say <span>YES</span>, My Fajar G! 🥹❤️</div>
  <div class="final2">My Pari G I love you forever</div>
  <div class="lyric">🎶 Aj tu le ma Teri hui, Tu aj mera ve 🎶</div>
  <div class="dev">DEVELOP BY <b>SAMAMA</b> 🖤</div>
 `;
 setTimeout(()=>{
   const v=document.getElementById('myVideo');
   v.muted=false; v.volume=1;
   v.play().catch(()=>{});
 },200);
};
</script>
</body>
</html>
