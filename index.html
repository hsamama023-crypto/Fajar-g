<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff2e78">
<title>Fajar G ❤️</title>
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,#ff758c,#ff2e78,#ffafbd);background-size:400% 400%;animation:bg 8s infinite;overflow:hidden}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.card{width:92%;max-width:360px;background:rgba(255,255,255,.96);border-radius:36px;padding:36px 22px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.35);position:relative}
.logo{font-size:64px;animation:beat 1s infinite}@keyframes beat{50%{transform:scale(1.25)}}
h1{font-size:27px;margin:10px 0}h1 span{color:#ff2e78}
.sub{color:#666;font-size:14px;margin-bottom:26px}
.btns{height:120px;position:relative;display:flex;justify-content:center;align-items:center;gap:16px}
.btn{border:0;padding:15px 30px;border-radius:100px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:.2s;user-select:none;-webkit-tap-highlight-color:transparent}
.yes{background:linear-gradient(135deg,#ff2e78,#ff7eb3);color:#fff;z-index:5}
.no{background:#222;color:#fff;position:absolute;left:190px;top:50px;z-index:10}
.heart{position:fixed;top:-5%;animation:fall linear forwards}
@keyframes fall{to{top:110vh;transform:rotate(360deg)}}
.final{font-size:22px;font-weight:800;color:#ff2e78;line-height:1.4}
.lyric{margin-top:12px;font-size:18px;font-weight:800;background:linear-gradient(90deg,#ff2e78,#ff9800);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
</style>
</head>
<body>
<div class="card" id="card">
<div class="logo">💖</div>
<h1>Will You Be My <span>Forever?</span></h1>
<p class="sub">My Dearest <b>Fajar G</b>, you are my everything!</p>
<div class="btns" id="area">
<button class="btn yes" id="yes">YES! 🥰</button>
<button class="btn no" id="no">No 🙈</button>
</div>
</div>
<audio id="song" src="song.mp3" preload="auto" loop></audio>
<script>
const noBtn=document.getElementById('no');
const area=document.getElementById('area');
let texts=["No 🙈","Are you sure? 😜","Pakka? 🤭","Socho phir se! 😏","Hehe 😂","Catch me! 🏃‍♀️","Nope! 😝"];

function runAway(){
  const maxX=area.clientWidth-80;
  const maxY=area.clientHeight-50;
  const x=Math.random()*maxX;
  const y=Math.random()*maxY;
  noBtn.style.left=x+'px';
  noBtn.style.top=y+'px';
  noBtn.innerText=texts[Math.floor(Math.random()*texts.length)];
}

// Mouse aate hi bhago, click hone se pehle hi!
noBtn.addEventListener('mouseenter',runAway);
noBtn.addEventListener('touchstart', (e)=>{e.preventDefault(); runAway();});
noBtn.addEventListener('click', (e)=>{e.preventDefault(); runAway(); return false;});

// Hearts
setInterval(()=>{
 let h=document.createElement('div');h.className='heart';h.innerText=['💖','💕','😂','❤️','✨'][Math.floor(Math.random()*5)];
 h.style.left=Math.random()*100+'vw';h.style.fontSize=(20+Math.random()*20)+'px';h.style.animationDuration=(2+Math.random()*2)+'s';
 document.body.appendChild(h);setTimeout(()=>h.remove(),4000);
},120);

document.getElementById('yes').onclick=()=>{
 document.getElementById('song').play().catch(()=>{});
 document.getElementById('card').innerHTML=`<div class="logo">😍💖</div><div class="final">Yayy! I Knew You'd Say YES,<br>My Fajar G! 🥹❤️</div><div class="lyric">🎶 Aj tu le ma Teri hui,<br>Tu aj mera ve 🎶</div><p class="sub" style="margin-top:14px">Ab to NO ka option hi nahi bacha! 😂</p>`;
};
</script>
</body>
</html>
